name: Source-derived statements
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop]
  schedule:
    # Catch Cacti source changes that make the manual stale between edits.
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-code-claims-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  claims:
    name: Check statements against Cacti develop
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the Cacti source this manual documents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Cacti/cacti
          ref: develop
          path: cacti-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test the checker
        run: |
          python3 -m pip install --quiet coverage==7.13.2
          python3 -m coverage run --branch --include=bin/check_code_claims.py \
            -m unittest discover -s bin/tests -p test_code_claims.py
          python3 -m coverage report --fail-under=100
      - name: Compare the manual with the Cacti source
        run: |
          echo "Cacti develop $(git -C cacti-source rev-parse --short=12 HEAD)"
          python3 bin/check_code_claims.py --cacti cacti-source

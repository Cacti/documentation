name: HTML manual content
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: html-manual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  manual:
    name: Build and verify all manual chapters
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          tool_versions: |
            python 3.12.12
            uv 0.12.23
            node 22.23.4
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-html-${{ runner.os }}-${{ hashFiles('bin/build_html_docs.py.lock', '.github/coverage-requirements.txt') }}
          restore-keys: |
            uv-html-${{ runner.os }}-
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-browser-${{ runner.os }}-${{ hashFiles('tests/browser/package-lock.json') }}
          restore-keys: |
            npm-browser-${{ runner.os }}-
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Resolve the committed renderer lock
        run: |
          set -euo pipefail
          mise exec python@3.12.12 uv@0.12.23 -- uv export --locked \
            --script bin/build_html_docs.py --format requirements-txt \
            --output-file "$RUNNER_TEMP/html-requirements.txt"
          mise exec python@3.12.12 uv@0.12.23 -- uv venv --python python "$RUNNER_TEMP/html-venv"
          mise exec python@3.12.12 uv@0.12.23 -- uv pip install \
            --python "$RUNNER_TEMP/html-venv/bin/python" --only-binary :all: --require-hashes \
            -r "$RUNNER_TEMP/html-requirements.txt" -r .github/coverage-requirements.txt
      - name: Check publication regressions and build the complete manual
        run: |
          set -euo pipefail
          mkdir -p html-artifacts
          venv_python="$RUNNER_TEMP/html-venv/bin/python"
          "$venv_python" -m coverage run --branch --include=bin/build_html_docs.py \
            -m unittest discover -s bin/tests -p test_html_manual.py
          "$venv_python" -m coverage run --append --branch --include=bin/build_html_docs.py \
            bin/build_html_docs.py --output html --archive html-artifacts/cacti-development-manual.zip
          "$venv_python" -m coverage report --fail-under=100
          "$venv_python" -m coverage json -o html-artifacts/coverage.json
      - name: Verify and extract the archive under test
        run: |
          mise exec python@3.12.12 -- python - <<'PYCODE'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('html-artifacts/cacti-development-manual.zip') as archive:
              if archive.testzip() is not None:
                  raise ValueError('Manual ZIP checksum failed')
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError('Unsafe archive member')
              archive.extractall('html-check')
          PYCODE
      - name: Install locked browser tooling
        working-directory: tests/browser
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mise exec node@22.23.4 -- npm ci --ignore-scripts
          if [ "$PLAYWRIGHT_CACHE_HIT" = 'true' ]; then
            mise exec node@22.23.4 -- npx --no-install playwright install-deps chromium
          else
            mise exec node@22.23.4 -- npx --no-install playwright install --with-deps chromium
          fi
      - name: Render every chapter and check legacy bookmarks
        env:
          HTML_MANUAL_ROOT: ${{ github.workspace }}/html-check
        working-directory: tests/browser
        run: |
          mkdir -p artifacts
          mise exec node@22.23.4 -- node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout --test-reporter-destination=artifacts/browser-junit.xml \
            html-manual.test.cjs
      - name: Summarize actual publication evidence
        if: always()
        run: |
          mise exec python@3.12.12 -- python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('tests/browser/artifacts/browser-evidence.json')
          if path.exists():
              result = json.loads(path.read_text())
              summary = (f"## HTML manual\n\nComplete: {result.get('complete', False)}\n\n"
                         f"Rendered pages: {len(result['rendered_pages'])}\n\n"
                         f"Legacy chapters: {len(result['legacy_pages'])}\n\n"
                         f"Legacy bookmarks: {result.get('legacy_anchors', 0)}\n\n"
                         f"Source: {result.get('source_revision', 'unavailable')}\n")
          else:
              summary = '## HTML manual\n\nBrowser validation did not complete.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary)
          PY
      - name: Preserve the manual, checksums, screenshots and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cacti-html-manual-attempt-${{ github.run_attempt }}
          path: |
            html-artifacts/
            tests/browser/artifacts/
          if-no-files-found: warn
          retention-days: 14
  publish:
    # The build job runs third-party tooling with a read-only token. Only this
    # job, which runs no repository code, can write the release assets.
    name: Publish development HTML manual
    needs: manual
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: manual-editions-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: manuals-develop
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cacti-html-manual-attempt-${{ github.run_attempt }}
          path: built
      - name: Verify the staged HTML manual archive
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          evidence_path = Path('built/tests/browser/artifacts/browser-evidence.json')
          if not evidence_path.is_file():
              raise SystemExit('Missing browser verification evidence')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if evidence.get('complete') is not True:
              raise SystemExit('Browser verification evidence is not complete')

          archive_path = Path('built/html-artifacts/cacti-development-manual.zip')
          if not archive_path.is_file():
              raise SystemExit('Missing HTML manual archive')
          with ZipFile(archive_path) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('HTML manual ZIP checksum failed')
              names = archive.namelist()
              if not names:
                  raise SystemExit('HTML manual ZIP is empty')
              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive member: {name}')
          PY
      - name: Upload the HTML manual archive to the development release
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes="Development (Cacti 1.3) manual editions built and verified from ${GITHUB_SHA::12}. Rebuilt after each change to develop."
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Development manual editions' --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" built/html-artifacts/cacti-development-manual.zip --clobber

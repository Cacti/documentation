name: Spelling

on:
  push:
    branches: [develop]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: docs-spelling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codespell:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install codespell
        run: "python3 -m pip install --only-binary :all: --require-hashes -r .github/codespell-requirements.txt"

      - name: Run codespell
        run: codespell --config .codespell.cfg
